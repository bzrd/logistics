# Example Secret structures – DO NOT commit with real values.
# Apply with: kubectl apply -f secrets.example.yaml
# (after filling in the base64-encoded values)
#
# Encode values: echo -n 'value' | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: oracle-credentials
type: Opaque
data:
  ORACLE_USER: <base64>
  ORACLE_PASSWORD: <base64>
  ORACLE_HOST: <base64>
  ORACLE_PORT: <base64>       # optional, default 1521
  ORACLE_SERVICE: <base64>

---
apiVersion: v1
kind: Secret
metadata:
  name: oracle-rest-api-auth
type: Opaque
data:
  BASIC_AUTH_USER: <base64>
  BASIC_AUTH_PASSWORD: <base64>
